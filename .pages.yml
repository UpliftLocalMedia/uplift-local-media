                              - { name: logo, label: Logo, type: image, required: false }
                              - { name: href, label: "Link (opens in new tab)", type: string, required: false }
                      - { name: order, label: Order, type: number, required: false }
              # -------------------------------------------------------------
              # team — TeamSection.astro (grid of team member cards)
              # -------------------------------------------------------------
              - name: team
                label: "Team"
                fields:
                  - name: value
                    label: " "
