                  - name: value
                    label: " "
                    type: object
                    fields:
                      - { name: title, label: Title, type: string, required: false }
                      - { name: subtitle, label: Subtitle, type: string, required: false, description: "Leave the field out to show the default subtitle; set it empty to hide it." }
                      - { name: description, label: Description, type: rich-text, required: false }
                      - { name: buttonText, label: Button Text, type: string, required: false }
                      - { name: buttonHref, label: Button Link, type: string, required: false }
