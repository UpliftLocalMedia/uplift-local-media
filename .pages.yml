                          - { name: name, label: Name, type: string, required: false }
                          - { name: href, label: Link, type: string, required: false }
                          - { name: description, label: Description, type: string, required: false }
                      - { name: order, label: Order, type: number, required: false }
              # -------------------------------------------------------------
              # network — NetworksSection.astro (brand-logo carousels)
              # -------------------------------------------------------------
              - name: network
                label: "Networks"
