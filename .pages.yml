                        options:
                          values: [card, bold, banner]
                      - { name: title, label: Title, type: string, required: false }
                      - { name: description, label: Description, type: rich-text, required: false, description: "Renders as HTML. Use the Source tab for styled links." }
                      - { name: buttonText, label: Button Text, type: string, required: false }
                      - { name: buttonHref, label: Button Link, type: string, required: false }
                      - { name: image, label: Image, type: image, required: false }
                      - { name: imageAlt, label: Image Alt Text, type: string, required: false }
                      - { name: order, label: Order, type: number, required: false }
              # -------------------------------------------------------------
              # faq — FAQs.astro (accordion of question/answer pairs)
              # -------------------------------------------------------------
              - name: faq
                label: "FAQs"
                fields:
                  - name: value
                    label: " "
                    type: object
                    fields:
                      - { name: badge, label: Eyebrow / Badge, type: string, required: false }
