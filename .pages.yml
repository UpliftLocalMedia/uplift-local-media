                          - { name: image, label: Photo, type: image, required: false }
                          - { name: bio, label: Bio, type: text, required: false }
                      - { name: order, label: Order, type: number, required: false }
              # -------------------------------------------------------------
              # reviews — ReviewsSection.astro (reviews from the Google Reviews singleton)
              # -------------------------------------------------------------
              - name: reviews
                label: "Google Reviews"
                fields:
