                      - { name: buttonText, label: Button Text, type: string, required: false }
                      - { name: buttonHref, label: Button Link, type: string, required: false }
                      - { name: order, label: Order, type: number, required: false }
              # -------------------------------------------------------------
              # contact — FormSection.astro (contact form + contact details)
              # -------------------------------------------------------------
              - name: contact
                label: "Contact Form"
                fields:
                  - name: value
                    label: " "
                    type: object
                    fields:
                      - name: variant
                        label: Variant
                        type: select
                        required: false
                        options:
                          values: [split]
                      - { name: title, label: Title, type: string, required: false }
                      - { name: description, label: Description, type: rich-text, required: false }
                      - { name: secondaryDescription, label: Secondary Description, type: text, required: false }
                      - { name: submitText, label: Submit Button Text, type: string, required: false }
                      - { name: submitAction, label: Submit Action (form endpoint URL), type: string, required: false }
                      - name: contactInfo
                        label: Contact Info
                        type: object
                        description: "Phone/email/location shown beside the form. Tokens like {phone} pull from Site Settings."
                        fields:
                          - { name: phoneFormatted, label: "Phone (formatted)", type: string, required: false }
                          - { name: phone, label: "Phone (digits, for tel: link)", type: string, required: false }
                          - { name: email, label: Email, type: string, required: false }
                          - { name: location, label: Location, type: string, required: false }
                      - name: formFields
                        label: Form Fields
                        type: object
                        list:
                          collapsible:
                            collapsed: true
                            summary: "{index}. {fields.label}"
                        fields:
                          - { name: id, label: ID, type: string, required: false }
                          - { name: name, label: Name (form key), type: string, required: false }
                          - { name: label, label: Label, type: string, required: false }
                          - name: type
                            label: Field Type
                            type: select
                            required: false
                            options:
                              values: [text, email, tel, number, textarea, select, checkbox, radio]
                          - { name: placeholder, label: Placeholder, type: string, required: false }
                          - { name: required, label: Required, type: boolean, required: false }
                          - name: width
                            label: Width
                            type: select
                            required: false
                            options:
                              values: [full, half]
                          - { name: rows, label: "Rows (for textarea)", type: number, required: false }
                          - name: options
                            label: "Options (for select/radio)"
                            type: string
                            list: true
                      - { name: order, label: Order, type: number, required: false }
          # --- Legal body sections (privacy.json / terms.json only) ---
          - name: legalSections
            label: Legal Sections
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{index}. {fields.title}"
            fields:
              - { name: title, label: Heading, type: string, required: false }
              - { name: content, label: Content, type: rich-text, required: false, description: "Renders as HTML." }
          # --- Per-page SEO metadata override ---
          - name: metadata
            label: SEO Metadata
            type: object
            fields:
              - { name: title, label: Meta Title, type: string, required: false }
              - { name: description, label: Meta Description, type: text, required: false }
              - { name: keywords, label: Keywords, type: text, required: false }
              - { name: noindex, label: "No-index (hide from search engines)", type: boolean, required: false }
              - name: openGraph
                label: Open Graph
                type: object
                fields:
                  - { name: type, label: OG Type, type: string, required: false }
                  - name: images
                    label: OG Images
                    type: object
                    list: true
                    fields:
                      - { name: url, label: Image URL, type: string, required: false }

